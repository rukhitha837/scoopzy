spring.application.name=icecream-hub
server.port=8080

# PostgreSQL - override with env vars DB_URL / DB_USERNAME / DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/icecream_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (Base64-encoded secret, must be >= 256 bits)
app.jwt.secret=${JWT_SECRET:aWNlY3JlYW1odWItc3VwZXItc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NQ==}
app.jwt.expiration-ms=86400000

# Admin-uploaded images are stored here and served at /uploads/**
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
